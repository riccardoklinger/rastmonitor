services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  martin:
    image: maplibre/martin:latest
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./tiles:/tiles:ro
    command: ["/tiles"]
    # Not exposed to the host — reached only via Next.js proxy at /tiles/*

  ors:
    image: openrouteservice/openrouteservice:v10.1.0
    profiles: [routing]
    restart: unless-stopped
    mem_limit: ${ORS_MEMORY_LIMIT:-16g}
    environment:
      ORS_CONFIG_LOCATION: /home/ors/config/rastmonitor.yml
      REBUILD_GRAPHS: "false"
      XMS: ${ORS_XMS:-1g}
      XMX: ${ORS_XMX:-12g}
    volumes:
      - ./routing/ors-config.yml:/home/ors/config/rastmonitor.yml:ro
      - type: bind
        source: ${ORS_PBF:-./routing/germany-latest.osm.pbf}
        target: /home/ors/files/germany.osm.pbf
        read_only: true
        bind:
          create_host_path: false
      - ors_graphs:/home/ors/graphs
      - ors_logs:/home/ors/logs
    ports:
      - "127.0.0.1:8088:8082"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/ors/v2/health"]
      start_period: 120m
      interval: 30s
      timeout: 5s
      retries: 5

  ingestion:
    build: ./ingestion
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      STATIC_ENDPOINT: ${STATIC_ENDPOINT}
      DYNAMIC_ENDPOINT: ${DYNAMIC_ENDPOINT}
      CERT_FILE: /certs/client.p12
      P12_PASSWORD: ${P12_PASSWORD}
    volumes:
      - ${CERT_P12}:/certs/client.p12:ro
      - exports:/exports

  pygeoapi:
    build: ./pygeoapi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYGEOAPI_BASE_URL: ${PYGEOAPI_BASE_URL:-https://rast-monitor.de/ogcapi}
      PYGEOAPI_CONFIG: /pygeoapi/local.config.yml
      PYGEOAPI_OPENAPI: /pygeoapi/local.openapi.yml
    ports:
      - "127.0.0.1:9000:80"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-https://sgx.geodatenzentrum.de/gdz_basemapde_vektor/styles/bm_web_gry.json}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      martin:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MARTIN_URL: http://martin:3000
      ORS_URL: ${ORS_URL:-http://ors:8082/ors}
      EXPORT_DIR: /exports
      DOWNLOAD_USERNAME: ${DOWNLOAD_USERNAME:-}
      DOWNLOAD_PASSWORD: ${DOWNLOAD_PASSWORD:-}
      NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-https://sgx.geodatenzentrum.de/gdz_basemapde_vektor/styles/bm_web_gry.json}
    volumes:
      - exports:/exports:ro
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  db_data:
  exports:
  ors_graphs:
  ors_logs:
